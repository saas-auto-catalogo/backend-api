services:
  postgres:
    image: postgres:17-alpine
    container_name: auto-catalogo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auto_catalogo_db
    volumes:
      - auto_catalogo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_catalogo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: auto-catalogo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - auto_catalogo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  auto_catalogo_pgdata:
  auto_catalogo_redis:
